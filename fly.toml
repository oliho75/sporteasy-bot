# Plan B si Railway est en panne :
#   brew install flyctl && fly auth login
#   fly launch --no-deploy --copy-config --name sporteasy-bot --region cdg
#   fly volumes create data --region cdg --size 1
#   fly secrets set SPORTEASY_EMAIL=... SPORTEASY_PASSWORD=... ACCESS_TOKEN=$(openssl rand -hex 24)
#   fly deploy
#   → https://sporteasy-bot.fly.dev/?token=<ACCESS_TOKEN>
app = "sporteasy-bot"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8765"
  DATA_DIR = "/data"
  PUBLIC = "1"
  TZ = "Europe/Paris"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8765
  force_https = true
  auto_stop_machines = false   # le watcher doit tourner en continu
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"               # Chrome headless au login
